<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love you chakudu 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 20%,#fff5fa,transparent 32%),linear-gradient(135deg,#ffdce9,#f7dfff 55%,#ffe8d7);color:#713d59}
.scene{position:relative;width:min(94vw,760px);text-align:center;padding:28px 12px 10px}h1{margin:0 0 6px;font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-1.5px;color:#a64f7b}.sub{margin:0 0 10px;color:#9b6681}.cat{width:min(92vw,620px);margin:auto;animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}.cat svg{width:100%;height:auto;overflow:visible}.belly{animation:breathe 2.4s ease-in-out infinite;transform-origin:350px 400px}.heart{position:absolute;font-size:25px;color:#e879a8;animation:float 4s ease-in-out infinite}.h1{left:8%;top:28%}.h2{right:8%;top:36%;animation-delay:1s}.h3{left:17%;bottom:16%;animation-delay:2s}.h4{right:16%;bottom:14%;animation-delay:.6s}.paw{position:absolute;color:#d98bad;opacity:.55;font-size:28px}.p1{left:3%;top:12%}.p2{right:3%;top:16%}.footer{margin-top:-2px;font-size:1rem;color:#a56e89}@keyframes bob{0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-8px) scaleX(1.015)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.04)}}@keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:.65}50%{transform:translateY(-16px) scale(1.18);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="scene">
<span class="paw p1">🐾</span><span class="paw p2">🐾</span><span class="heart h1">♥</span><span class="heart h2">♥</span><span class="heart h3">♥</span><span class="heart h4">♥</span>

<path d="M215 495 L215 512 M240 493 L240 514 M265 495 L265 512 M445 495 L445 512 M470 493 L470 514 M495 495 L495 512" stroke="#c77d45" stroke-width="3" stroke-linecap="round" opacity=".6"/>
